<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>XXXVI Congreso Nacional de Urología 2026</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:1200px;height:630px;overflow:hidden;font-family:Arial,Helvetica,sans-serif;background:#071a38;color:#fff}
    body{
      position:relative;
      background:
        radial-gradient(circle at 84% 16%,rgba(34,94,160,.28),transparent 26%),
        radial-gradient(circle at 16% 86%,rgba(201,163,78,.15),transparent 28%),
        linear-gradient(135deg,#071a38 0%,#0a1f44 55%,#0b3155 100%);
    }
    .grid{position:absolute;inset:0;opacity:.06;background-image:linear-gradient(rgba(255,255,255,.45) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.45) 1px,transparent 1px);background-size:42px 42px}
    .goldArc{position:absolute;right:-160px;top:-170px;width:620px;height:620px;border:3px solid rgba(201,163,78,.55);border-radius:50%}
    .goldArc:after{content:"";position:absolute;inset:36px;border:1px solid rgba(201,163,78,.22);border-radius:50%}
    .medical{position:absolute;right:56px;top:46px;width:310px;height:250px;opacity:.26}
    .medical svg{width:100%;height:100%}
    .content{position:absolute;left:62px;top:44px;width:760px}
    .brand{display:flex;align-items:center;gap:18px;margin-bottom:28px}
    .logoBox{width:92px;height:92px;border:1px solid rgba(201,163,78,.35);border-radius:22px;background:rgba(255,255,255,.05);display:flex;align-items:center;justify-content:center;overflow:hidden}
    .logoBox img{max-width:84%;max-height:84%;object-fit:contain}
    .brandText{font-size:21px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#f4f0e5;line-height:1.3}
    .eyebrow{display:inline-flex;align-items:center;gap:10px;border:1px solid rgba(201,163,78,.45);background:rgba(201,163,78,.09);padding:9px 14px;border-radius:999px;color:#d9b65f;font-size:16px;font-weight:700;letter-spacing:.09em;text-transform:uppercase}
    .dot{width:8px;height:8px;border-radius:50%;background:#d9b65f;box-shadow:0 0 12px rgba(217,182,95,.75)}
    h1{margin:22px 0 0;font-size:64px;line-height:1.03;letter-spacing:-.035em;font-weight:800;max-width:820px}
    h1 .gold{color:#d9b65f}
    .subtitle{margin-top:18px;font-size:24px;color:#d7dfeb;font-weight:500}
    .info{margin-top:34px;display:flex;gap:14px;flex-wrap:wrap}
    .pill{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055);border-radius:18px;padding:13px 17px;font-size:19px;color:#f2f5f9}
    .pill strong{color:#d9b65f}
    .footer{position:absolute;left:62px;right:62px;bottom:34px;display:flex;justify-content:space-between;align-items:flex-end;border-top:1px solid rgba(255,255,255,.10);padding-top:18px}
    .footer span:first-child{font-size:16px;color:#94a3b8}
    .footer span:last-child{font-size:17px;font-weight:700;color:#d9b65f}
  </style>
</head>
<body>
  <div class="grid"></div>
  <div class="goldArc"></div>
  <div class="medical">
    <svg viewBox="0 0 320 260" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M103 42c-29 2-50 26-50 58 0 32 19 56 46 58 16 1 26-8 29-23 4-19-3-34-3-52 0-18-8-42-22-41Z" stroke="#d9b65f" stroke-width="4"/>
      <path d="M217 42c29 2 50 26 50 58 0 32-19 56-46 58-16 1-26-8-29-23-4-19 3-34 3-52 0-18 8-42 22-41Z" stroke="#d9b65f" stroke-width="4"/>
      <path d="M123 129c10 35 19 52 37 71M197 129c-10 35-19 52-37 71" stroke="#d9b65f" stroke-width="4"/>
      <path d="M160 199c-16 0-29 11-29 25s13 25 29 25 29-11 29-25-13-25-29-25Z" stroke="#d9b65f" stroke-width="4"/>
    </svg>
  </div>

  <main class="content">
    <div class="brand">
      <div class="logoBox"><img src="/logo-svu.png" alt="SVU"></div>
      <div class="brandText">Sociedad Venezolana<br>de Urología</div>
    </div>
    <div class="eyebrow"><span class="dot"></span> Programa actualizado</div>
    <h1>XXXVI Congreso Nacional<br><span class="gold">de Urología 2026</span></h1>
    <div class="subtitle">Dr. Nelson Medero · Encuentro científico nacional</div>
    <div class="info">
      <div class="pill"><strong>4–7</strong> de noviembre de 2026</div>
      <div class="pill">Hotel Tibisay · Isla de Margarita</div>
    </div>
  </main>

  <div class="footer">
    <span>Programa académico · Invitados · Sedes · Inscripción</span>
    <span>congreso2026-azure.vercel.app</span>
  </div>
</body>
</html>
